# docs/13_CODE_QUALITY.md: very_good_analysis is the base ruleset. Every delta
# below carries the reason it exists.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - windows/**
    - linux/**
    # Generated by `flutter gen-l10n`; committed so a fresh clone analyzes
    # clean, but not our code to lint.
    - lib/l10n/gen/**
    - android/**
    - ios/**
    - web/**
    - macos/**
  errors:
    # docs/09_I18N.md rule 1: no hardcoded user-facing strings. This is the
    # closest lint to that rule, and it is an error rather than a warning
    # because "we'll localize it later" never happens.
    missing_required_param: error
    missing_return: error
    # MarkdownRenderer and CodeHighlighter are single-method on purpose: they
    # are the documented swap points for the S1 decision (CLAUDE.md rule 6),
    # and a named interface carries the contract — "must not throw", "must
    # degrade" — where a bare function type would carry nothing. Silenced
    # here rather than in `linter:` because the rule is deprecated and
    # listing it there is itself a warning.
    one_member_abstracts: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── Deltas from very_good_analysis ────────────────────────────────────
    # doc 13 scopes /// documentation to core/ (core is the app's API), not to
    # every widget in features/. Enforced by review, not by a global lint that
    # would push people toward writing filler doc comments.
    public_member_api_docs: false

    # doc 13: "No `dynamic` in app code". very_good_analysis already covers
    # most of this; these make the remaining holes explicit.
    avoid_dynamic_calls: true
    prefer_final_locals: true

    # pubspec dependencies are grouped by architectural layer with comments
    # saying which ones may only be imported from features/reader/rendering/.
    # That grouping is load-bearing here; alphabetical order would erase it.
    sort_pub_dependencies: false
