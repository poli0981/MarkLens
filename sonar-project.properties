# docs/14_CI_CD.md, "SonarQube Cloud". Read by the `sonarcloud` job in ci.yml.
#
# Automatic analysis is off on the SonarQube Cloud side, deliberately: it cannot
# run `flutter pub get`, so the Dart analyzer would resolve no package imports,
# and it cannot see coverage at all. The CI job runs after `test`, on the lcov
# report the ubuntu leg already produced.
sonar.projectKey=poli0981_MarkLens
sonar.organization=poli0981
sonar.projectName=MarkLens
sonar.sourceEncoding=UTF-8

# The app is lib/. The C++ runners are Flutter's template plus a window title
# and one destructor line of our own, and analysing C++ here needs a
# compilation database the Flutter build does not emit; CodeQL scans them (and
# the Python under tool/) build-free instead.
sonar.sources=lib
sonar.tests=test,integration_test,test_driver

# Written by `flutter gen-l10n` and committed so a fresh clone analyzes clean
# (docs/09_I18N.md). Not code anyone here writes, and analysis_options.yaml
# excludes it from the linter for the same reason.
sonar.exclusions=lib/l10n/gen/**

# `flutter test --coverage` on the ubuntu leg of the `test` job.
sonar.dart.lcov.reportPaths=coverage/lcov.info

# The job fails when the quality gate does, so a red gate is a red check on the
# PR rather than a badge somebody has to remember to look at.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
