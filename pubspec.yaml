name: marklens
description: "A fast, lightweight, read-only Markdown viewer."
publish_to: "none"

# Single source of truth for the app version (docs/11_PACKAGING_UPDATE.md).
# Mirrored by hand into lib/app/version.dart, because --version has to answer
# before a Flutter binding exists; test/app/version_test.dart fails if the two
# ever drift.
version: 1.0.1+2

environment:
  sdk: ^3.13.1

# docs/01_TECH_STACK.md: exact versions, no carets, lockfile committed.
# A new dependency needs a row in doc 01 AND legal/THIRD_PARTY_NOTICES.md in
# the same PR, with the license verified (CLAUDE.md rule 10).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Markdown: parse (pure Dart, core/) ──────────────────────────────────
  markdown: 7.3.1

  # ── Markdown: render (widget layer, features/reader/rendering/ only) ────
  # Ratified by S1 + S2 (docs/01_TECH_STACK.md). Imported ONLY from
  # features/reader/rendering/ — CLAUDE.md rule 6, enforced by
  # test/architecture/core_purity_test.dart.
  flutter_markdown_plus: 1.0.12
  # S1c chose the pure-Dart engine over the flutter_highlight widget wrapper:
  # this project's CodeHighlighter seam returns spans, not a widget, and the
  # wrapper's only other contribution was themes we would rather derive from
  # our own doc 06 tokens. One dependency (collection), no platform code.
  highlight: 0.7.0
  flutter_svg: 2.3.0

  # ── State ───────────────────────────────────────────────────────────────
  riverpod: 3.4.2
  flutter_riverpod: 3.4.2

  # ── Desktop shell ───────────────────────────────────────────────────────
  window_manager: 0.5.2
  desktop_drop: 0.8.0
  file_picker: 12.0.0
  url_launcher: 6.3.2
  path_provider: 2.1.6

  # ── Pure Dart services ──────────────────────────────────────────────────
  watcher: 1.2.1
  args: 2.7.0
  # Already in the tree via markdown and flutter_markdown_plus, and already on
  # doc 02's allowlist for core/ — direct since M3, when link routing needed to
  # resolve a relative path against a document's directory on both platforms.
  path: 1.9.1
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The charter's fps and first-paint gates need real frames, which widget
  # tests cannot give — they drive a fake clock (docs/12_TESTING.md item 6).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # The OFL requires the licence to travel with the font, and
    # LicenseRegistry does not collect asset licences the way it collects
    # package ones - lib/app/license_registry.dart registers these by hand so
    # Help -> Third-party Licenses actually lists the fonts we ship
    # (legal/THIRD_PARTY_NOTICES.md, release gate).
    #
    # Listed file by file rather than as `legal/licenses/`, which would also
    # ship that directory's README and the three package-licence bodies - none
    # of which the app reads, and all of which would sit in every artefact.
    - legal/licenses/OFL-1.1-NotoSans.txt
    - legal/licenses/OFL-1.1-NotoSansJP.txt
    - legal/licenses/OFL-1.1-JetBrainsMono.txt

  # Built by tool/fonts/build_fonts.py from pinned upstream releases and
  # subsetted; fonts/README.md carries the sources, the hashes and the numbers.
  # Declared here but not yet selected by any style - wiring the typography is
  # the next PR, so that a golden diff has exactly one cause
  # (docs/01_TECH_STACK.md, docs/12_TESTING.md).
  fonts:
    - family: Noto Sans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Italic.ttf
          style: italic
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: fonts/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Sans JP
      fonts:
        - asset: fonts/NotoSansJP-Regular.otf
        - asset: fonts/NotoSansJP-Bold.otf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
