# docs/14_CI_CD.md, "Dependency audit".
#
# What a pull request does to the dependency graph — pubspec.lock and the
# actions pinned here — checked against the advisory database: a PR that adds
# or moves to a version with a known advisory fails here, at review time,
# rather than as a Dependabot alert after the merge.
#
# Vulnerabilities only. The licence half was switched off on its first run
# (2026-10-26): GitHub's dependency graph reports pub licences in lowercase —
# `mit`, `bsd-3-clause`, `apache-2.0` — which the action's SPDX parser rejects
# as invalid, and an unparseable licence is a hard failure there, not a
# warning. With every pub package unparseable, an allow-list would fail every
# PR that touches pubspec.lock and check nothing. Rule 10's licence check stays
# a person's (doc 01), and pin_agreement_test keeps the batch PR red until it
# is done. Re-enable `allow-licenses` when the graph reports SPDX ids for pub.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: false
