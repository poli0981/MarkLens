# docs/14_CI_CD.md.
#
# House convention is a thin caller stub delegating to a reusable workflow in
# poli0981/.github. That suite has no Dart/Flutter stack yet (action A-1), so
# these jobs live here inline — written lift-and-shift-ready, with the same job
# names and inputs the future reusable will take.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact pin, recorded in docs/01_TECH_STACK.md. Must never disagree with it.
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Localizations are up to date
        # Generated ARB output is committed so a fresh clone analyzes clean
        # (docs/09_I18N.md). Regenerating must produce no diff.
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen \
            || { echo "::error::lib/l10n/gen is stale — run flutter gen-l10n"; exit 1; }

  test:
    name: test (${{ matrix.os }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Goldens are stable only on the ubuntu runner with the bundled fonts,
      # so they are excluded everywhere else (docs/12_TESTING.md).
      - name: Unit, widget and architecture tests
        run: flutter test --exclude-tags golden --coverage
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  golden:
    name: golden (ubuntu)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Detect golden tests
        id: detect
        run: |
          if grep -rlq "@Tags(\['golden'\])" test/; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No golden tests exist yet (docs/12_TESTING.md, pyramid item 3). This job activates itself as soon as one lands."
          fi
      - name: Run goldens
        if: steps.detect.outputs.present == 'true'
        run: flutter test --tags golden

  build-smoke:
    name: build-smoke (${{ matrix.os }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build (linux)
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --debug
      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        run: flutter build windows --debug
