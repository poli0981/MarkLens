# docs/14_CI_CD.md.
#
# House convention is a thin caller stub delegating to a reusable workflow in
# poli0981/.github. That suite has no Dart/Flutter stack, and action A-1 — which
# was to contribute one — is dropped from v1 (docs/15, "M4 build order",
# decision 5): designing a reusable release interface before this repo has ever
# run a release would abstract something nobody here has done yet. So these jobs
# are the real ones rather than a placeholder for them, and doc 14 says so.
#
# Caching is the action's, not ours. `cache: true` also enables the pub cache
# unless pub-cache is set explicitly, and the action keys that on
# hashFiles('**/pubspec.lock') itself — so doc 14's "caches keyed on the
# lockfile" is already true and a second actions/cache step would only fight it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact pin, recorded in docs/01_TECH_STACK.md. Must never disagree with it.
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Localizations are up to date
        # Generated ARB output is committed so a fresh clone analyzes clean
        # (docs/09_I18N.md). Regenerating must produce no diff.
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen \
            || { echo "::error::lib/l10n/gen is stale — run flutter gen-l10n"; exit 1; }
      - name: No golden failure dumps are tracked
        # flutter_test writes four PNGs per failing golden into
        # test/goldens/failures/. Twelve of them were committed once and nobody
        # noticed for two milestones, because a binary file nobody opens is
        # invisible in review. .gitignore stops the next one reaching the index;
        # this stops it reaching main if it does (docs/12_TESTING.md).
        run: |
          tracked="$(git ls-files test/goldens/failures)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::Golden failure dumps are build output, not source. Run: git rm -r --cached test/goldens/failures"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Goldens are byte comparisons against references generated on one
      # image, so they run only on the pinned ubuntu job and are excluded here
      # (docs/12_TESTING.md). The difference is rasterization, not fonts: the
      # first goldens were generated on Windows and four of five differed from
      # the Ubuntu render while both layouts were correct.
      - name: Unit, widget and architecture tests
        # watcher-live touches the real filesystem and sleeps in real time to
        # observe platform watcher behaviour (spike S5). Shared runners are the
        # wrong place for that; the dedicated watch-observation workflow runs it
        # deliberately instead.
        run: flutter test --exclude-tags "golden || watcher-live" --coverage
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  golden:
    name: golden (ubuntu-24.04)
    needs: test
    # Pinned, not `ubuntu-latest`, and the pin is load-bearing rather than
    # tidiness: tool/goldens/Dockerfile is FROM ubuntu:24.04, and the image that
    # compares a golden has to be the image that made it. `ubuntu-latest` is
    # 24.04 today and ubuntu-26.04 images already exist; the day the label moves,
    # every golden fails byte-for-byte with nothing wrong in any layout, and it
    # reads like a flake. test/repo/pin_agreement_test.dart holds the two
    # numbers together (docs/12_TESTING.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Detect golden tests
        id: detect
        run: |
          if grep -rlq "@Tags(\['golden'\])" test/; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No golden tests exist yet (docs/12_TESTING.md, pyramid item 3). This job activates itself as soon as one lands."
          fi
      - name: Run goldens
        if: steps.detect.outputs.present == 'true'
        run: flutter test --tags golden --exclude-tags watcher-live

  build-smoke:
    name: build-smoke (${{ matrix.os }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build (linux)
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --debug
      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        run: flutter build windows --debug
