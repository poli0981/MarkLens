# Records what the `watcher` package reports for each editor save pattern, on
# both platforms. Born of spike S5, kept because the answer depends on the
# platform and the package rather than on our code — ext4/inotify in particular
# is the half a Windows machine cannot answer.
#
# Not part of `ci.yml`; it gates nothing.
name: watch-observation

# Manual only. Watcher behaviour changes with the platform and the package,
# not with our commits, so this is a tool to re-run when either moves rather
# than a gate on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: observe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Observe save patterns
        run: flutter test --tags watcher-live test/platform/watch_observation_test.dart
      - name: Print the report
        if: always()
        shell: bash
        run: cat build/s5_observations.md || echo "(no report produced)"
